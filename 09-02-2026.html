<!-- How to Create Basic Form -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form>

<img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo" style="display:block; margin:auto;">
        <table align="center">
            <tr>
                <td> <label for="name">Name:</label></td>
                <td><input type= "text" name="name" id="name" placeholder="Enter Your Name"> </td>
            </tr>
            <tr>
                <td> <label for="email">Email:</label></td>
                <td><input type= "text" name="email" id="email" placeholder="Enter Your Email"> </td>
            </tr>
            <tr>
                <td> <label for="phone">Phone:</label></td>
                <td><input type= "text" name="phone" id="phone" placeholder="Enter Your Phone Number " required> </td>
            </tr>
            <tr>
                <td> <label for="pass">Password:</label></td>
                <td><input type= "password" name="pass" id="pass" placeholder="Enter Your Password"> </td>
            </tr>
            <td><lable>Gender</lable></td>
            <td> 
                <input type="radio" name="gender" value="male"/>Male
                <input type="radio" name="gender"/>Female
                </td>
            </tr>
            <tr>
                <td> <label for="validation">Room Preferance</label></td>
                <td>
                    <input type="checkbox" name="validation" id="validation"/>AC Room
                    <input type="checkbox" name="validation" id="validation"/>Non-AC Room
                    <input type="checkbox" name="validation" id="validation"/>AC Room with Geyser

                </td>
            </tr>
            <td><lable for="adderss">Address</lable> </td>
            <td>
                <textarea name="adderss" id="address" style="resize:none;" placeholder="Enter Full Address"></textarea>
            </td>
            <tr>
                <td> <label for="country">Country:</label></td>
                <td>
                    <select id="country">
                        <option> </option>
                        <option selected>India</option>
                        <option>USA</option>
                        <option>UK</option>
                        <!-- <option selected> USA </option> -->
                        <option> USA </option>
                        <option> Russia </option>
                        <option> India</option>
                        <option> UK </option>
                        <option> USA </option>
                        <option> Russia </option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><input type="submit" value="Submit"></td>
                <td><input type="reset" value="Reset"></td>
            </tr>

        </table>
    </form>
    
</body>
</html>
